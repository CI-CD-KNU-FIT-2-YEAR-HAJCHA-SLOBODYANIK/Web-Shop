<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}My Shop{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-card { height: 100%; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'shop:product_list' %}">E-Shop</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'shop:cart_detail' %}">
                    Кошик: 
                    <span class="badge bg-primary">
                        {% with total_items=cart|length %}
                            {% if total_items > 0 %} {{ total_items }} {% else %} 0 {% endif %}
                        {% endwith %}
                    </span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %} {% endblock %}
    </div>
</body>
</html>
